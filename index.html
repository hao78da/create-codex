  var SPOKE_SLOT = 40;           // 一条射线上相邻两球的间距
  var spokeAng = [];             // 每条射线的角度
  var spokeStart = [];           // 每条线的起始长度比例
  var spokeGap = [];             // 每条线内部相邻球的间距
  function hashId(s){
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1000003;
    return h;
  }
  function relayout(){
    separatedFor = -1;
    var l1 = [];
    for (var i = 0; i < MODS.length; i++) if (MODS[i].level === 1) l1.push(MODS[i]);
    var n = l1.length;

    // ── 向日葵盘状排布 + 扇区分组画线 ──
    // 球的位置用黄金角螺旋算（任意两点不会挤在一起，视觉上像随机撒开）；
    // 角度再按扇区归类，每个扇区只画一根线到最远的球，线数大幅减少。
    var SECTORS = 40;                 // 扇区数 = 画出来的线数
    var RINNER = 210;                 // 内圈起点，避开中心大球
    var RMAX = 1180;                  // 最外圈半径：撒到远大于一屏，靠裁剪省性能
    ORBITY = RMAX;
    ORBITX = Math.round(RMAX * 1.34);
    ORBIT2 = 150;

    var ballR = Math.min(R0 * 0.46, 15);
    NSCALE = Math.max(0.30, Math.min(1, ballR / (R0 * 0.46)));
    SPOKE_SLOT = 34;

    var seed = 20261110;
    function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

    // 扇区中心角：均分后抖动，疏密不均
    spokeAng.length = 0;
    var stepA = Math.PI * 2 / SECTORS;
    var a0 = -Math.PI / 2 + stepA * rnd() * 0.8;
    for (var b0 = 0; b0 < SECTORS; b0++){
      spokeAng.push(a0);
      a0 += stepA * (0.74 + rnd() * 0.52);
    }

    // 每条线的起点与间距（让线长短不一）
    spokeStart.length = 0;
    spokeGap.length = 0;
    for (var g0 = 0; g0 < SECTORS; g0++){
      spokeStart.push(RINNER * (0.60 + rnd() * 0.32));
      spokeGap.push(SPOKE_SLOT * (0.88 + rnd() * 0.26));
    }

    // ── 黄金角螺旋撒球：半径用 sqrt 分布，面积密度均匀 ──
    var GA = Math.PI * (3 - Math.sqrt(5));
    var jit = rnd() * Math.PI * 2;
    var stepSec = Math.PI * 2 / SECTORS;
    for (var q = 0; q < n; q++){
      var m = l1[q];
      var t = (q + 0.5) / n;
      m._r = RINNER + (RMAX - RINNER) * Math.sqrt(t);
      m._theta = jit + GA * q;
      var rel = ((m._theta % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      m._spoke = Math.floor(rel / stepSec) % SECTORS;
      m.ang = spokeAng[m._spoke];
      m.rf = 1;
    }

    for (var w = 0; w < MODS.length; w++){
      if (MODS[w].level === 2) MODS[w].rf = 1;
    }
  }

  function separateNodes(){
    // 新布局按射线 + slot 精确排布，不需要旧的碰撞推挤逻辑
    return;
  }

  function fitView(){
    if (separatedFor !== MODS.length){ separateNodes(); separatedFor = MODS.length; }
    if (userZoomed) return;
    var pad = 64;
    var lpad = 96;    // 外侧文字预留
    // 先按最新参数把节点摆一次，再按真实坐标算包围盒
    for (var i0 = 0; i0 < MODS.length; i0++){

    }
    var maxX = 1, maxY = 1;

      var mm = MODS[i];
      if (mm.level === 0) continue;
      var rr = baseRadius(mm);
      if (Math.abs(mm.bx) + rr > maxX) maxX = Math.abs(mm.bx) + rr;
      if (Math.abs(mm.by) + rr > maxY) maxY = Math.abs(mm.by) + rr;
    }
    var zx = (W - (pad + lpad) * 2) / (2 * maxX);
    var zy = (H - pad * 2) / (2 * maxY);
    LAST_FIT_Z = Math.max(0.18, Math.min(1.55, Math.min(zx, zy)));
    if (!userZoomed){

      view.z = 1;
      view.x = W / 2;
      view.y = H / 2;
    }
  }       // 二级附属离父节点的距离

  // 联动：两个模组之间有配方互通，画虚线（不是从属）
  // 联动：两模组之间有真实的配方互通时才加（目前没有核实过的）
  var LINKS = [];

  var byId = {};
  // 图标加载失败时的兜底链：Create 本体 logo → 扳手 → 止血贴 logo
  // （来自上游 dca976aa，避免缺图时显示问号）
  var FALLBACK_ICONS = [
    'assets/icons/create_logo.png',
    'assets/icons/3d_create_wrench.png',
    'assets/icons/halitosis_logo.png'
  ];
  function swapIcon(m){
    if (m.fb === undefined) m.fb = -1;
    m.fb++;
    var next = m.fb < FALLBACK_ICONS.length
      ? FALLBACK_ICONS[m.fb]
      : FALLBACK_ICONS[FALLBACK_ICONS.length - 1];
    m.img = new Image();
    m.img.onload = function(){ if (!STATIC) requestAnimationFrame(draw); };
    m.img.onerror = function(){ if (m.fb < FALLBACK_ICONS.length - 1) swapIcon(m); };
    m.img.src = next;
  }
  MODS.forEach(function(m){
    byId[m.id] = m;
    m.kids = [];
    m.v = m.level <= 1 ? 1 : 0;      // 可见度（0..1），二级默认收起
    m.open = false;                   // 是否已展开
    m.grow = m.level <= 1 ? 1 : 0;    // 从父节点「长出来」的进度
    m.img = new Image();
    m.img.onerror = function(){ swapIcon(m); };
    m.img.src = m.icon;
  });
  MODS.forEach(function(m){ if (m.parent) byId[m.parent].kids.push(m); });
  window.__CODE__ = { MODS: MODS, byId: byId, draw: draw };

  function baseRadius(m){
    if (m.level === 0) return R0;
    // 射线布局下，球半径由射线上相邻间距决定，并保底 11px
    if (m.level === 1) return Math.max(11, Math.min(R0 * 0.46, SPOKE_SLOT * 0.40));
    return Math.max(7, Math.min(R0 * 0.34, SPOKE_SLOT * 0.30));
  }

  function place(m){
    var par = m.parent ? byId[m.parent] : null;
    if (!par){ m.bx = 0; m.by = 0; return; }
    var px = par.bx, py = par.by;
    if (m.level === 1){
      // 位置由 relayout 的向日葵螺旋算好（_r / _theta），这里只做椭圆化
      var th = (m._theta === undefined) ? m.ang : m._theta;
      var rr = (m._r === undefined) ? ORBITY * 0.7 : m._r;
      var ex = ORBITX / ORBITY;
      m.bx = px + Math.cos(th) * rr * ex * m.grow;
      m.by = py + Math.sin(th) * rr * m.grow;
    } else {
      var sib = par.kids.indexOf(m);
      var gap = baseRadius(par) * 2.0 + 14;
      m.ang = 0;
      m.bx = px + ((sib < 0 ? 0 : sib) * 9);
      m.by = py - ((sib < 0 ? 0 : sib) + 1) * gap * m.grow;
    }
  }

  var MOBILE_HINT = '拖动平移 · 双指缩放 · 点球进入';
  (function(){
    var h = document.querySelector('.hint');
    if (h && MOBILE) h.textContent = MOBILE_HINT;
  })();

  var stars = [];
  (function makeStars(){
    var seed = 20261110;
    function r(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    for (var i = 0; i < MAX_STARS; i++){
      stars.push({ x: (r() - .5) * 5200, y: (r() - .5) * 3600,
                   r: .5 + r() * 1.5, a: .18 + r() * .55, t: r() * 6.28 });
    }
  })();

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function toScreen(wx, wy){ return [wx * view.z + view.x, wy * view.z + view.y]; }
  function toWorld(sx, sy){ return [(sx - view.x) / view.z, (sy - view.y) / view.z]; }

  function advance(){
    var moving = false;
    for (var i = 0; i < MODS.length; i++){
      var m = MODS[i];

        for (var ci = 0; ci < MODS.length; ci++){
          var cn = MODS[ci];
          if (cn.level > 0 && cn.kids && cn.kids.length && cn.open){ cn.open = false; closed = true; }
        }
        if (closed) return;
        return;
      }
      if (m.kids.length && !m.open && m.level > 0){
        m.open = true;                 // 第一次点：把子节点放出来
        return;
      }
      if (m.level === 0) enterCreate();
      else leave(m.href);
    } else {
      var sp = Math.hypot(vel.x, vel.y);
      if (sp > VMAX){ vel.x *= VMAX / sp; vel.y *= VMAX / sp; }
      if (sp < 0.6){ vel.x = 0; vel.y = 0; }
    }
  });

  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      for (var ki = 0; ki < MODS.length; ki++){
        var kn = MODS[ki];
        if (kn.level > 0 && kn.kids && kn.kids.length) kn.open = false;
      }
    }
  });

  cv.addEventListener('pointercancel', function(){ dragging = false; cv.classList.remove('drag'); vel.x = 0; vel.y = 0; });

  cv.addEventListener('wheel', function(e){
    e.preventDefault();
    var z0 = view.z;
    var nz = Math.min(3, Math.max(0.35, z0 * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    view.x = e.clientX - (e.clientX - view.x) * (nz / z0);
    view.y = e.clientY - (e.clientY - view.y) * (nz / z0);
    view.z = nz;
  }, { passive: false });

  if (!LINKS.length){ var ld=document.getElementById('leg-dash'); if(ld) ld.style.display='none'; }

  var _fb = document.getElementById('fitbtn');
  if (_fb) _fb.addEventListener('click', function(){
    userZoomed = false;
    var cx = 0, cy = 0, n = 0;
    for (var fi = 0; fi < MODS.length; fi++){
      var fm = MODS[fi]; place(fm);
      if (fm.level === 0) continue;
      cx += fm.bx; cy += fm.by; n++;
    }
    view.z = LAST_FIT_Z; view.x = W / 2; view.y = H / 2;
  });

  resize();
  relayout();
  fitView();
  window.addEventListener('resize', function(){
    resize();
    relayout();
    fitView();
    if (STATIC) draw(performance.now());
  });

  // 首帧先画一次：图片加载完再补一帧（静态模式也不空白）
  draw(0);
  MODS.forEach(function(m){
    m.img.addEventListener('load', function(){ if (STATIC) draw(performance.now()); });
  });
  if (STATIC) return;
  requestAnimationFrame(draw);
})();
</script>
<style>#fitbtn{position:fixed;right:16px;bottom:74px;z-index:5;width:38px;height:38px;border-radius:10px;background:rgba(20,16,12,.86);border:1px solid rgba(217,164,65,.45);color:#e8cf9a;font-size:17px;line-height:1;cursor:pointer}#fitbtn:hover{border-color:#d9a441;color:#fff}</style>
<button id="fitbtn" title="适应视图（显示全部）">⤢</button>
</body>
</html>
