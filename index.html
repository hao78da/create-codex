  var NSCALE = 1;                // 球体缩放，按一级节点数量自动收紧
  function relayout(){
    separatedFor = -1;
    var n = 0;
    for (var i = 0; i < MODS.length; i++) if (MODS[i].level === 1) n++;
    n = Math.max(6, n);
    var per = n * 104;                       // 每节点预留弧长（只算图标，不留文字）
    var b = per / (2 * Math.PI * 1.16);
    b = Math.max(240, Math.min(560, b));
    ORBITX = Math.round(b * 1.35);
    ORBITY = Math.round(b);
    NSCALE = Math.min(1, 20 / n);
    // 每个模组的连线长度略有差别：按 id 做确定性抖动，看起来更自然
    // 双环交错：偶数号在内环、奇数号在外环，角度错开半步
    var ring = [[], []];
    for (var i = 0; i < MODS.length; i++){
      var mm = MODS[i];
      if (mm.level !== 1) continue;
      ring[i % 2].push(mm);
    }
    var RFA = 0.62, RFB = 1.06;      // 内环 / 外环
    for (var r = 0; r < 2; r++){
      var arr = ring[r], k = arr.length;
      if (!k) continue;
      var step = Math.PI * 2 / k;
      var base = -Math.PI / 2 + (r ? 0.04 : 0);
      for (var j = 0; j < k; j++){
        arr[j].ang = base + step * j;
        var hh = 0, iid = String(arr[j].id);
        for (var q = 0; q < iid.length; q++) hh = (hh * 31 + iid.charCodeAt(q)) % 1000;
        arr[j].rf = 0.52 + (hh % 70) / 100;   // 距离随机（按 id 哈希，刷新不变）
      }
    }
  }
  // 让任意两个图标至少隔开 gap 像素：只微调半径（必要时轻推角度）
  function separateNodes(){
    var list = [];
    for (var i = 0; i < MODS.length; i++) if (MODS[i].level === 1) list.push(MODS[i]);
    var gap = R0 * 0.46 * NSCALE * 4.0;   // 两个半径再多一点空隙
    for (var it = 0; it < 200; it++){
      var moved = false;
      for (var a = 0; a < list.length; a++){
        for (var b = a + 1; b < list.length; b++){
          var A = list[a], B = list[b];
          var ax = Math.cos(A.ang) * ORBITX * A.rf, ay = Math.sin(A.ang) * ORBITY * A.rf;
          var bx = Math.cos(B.ang) * ORBITX * B.rf, by = Math.sin(B.ang) * ORBITY * B.rf;
          var dx = ax - bx, dy = ay - by, d = Math.hypot(dx, dy);
          if (d >= gap || d < 0.001) continue;
          var need = (gap - d) / 2;
          if (Math.abs(A.rf - B.rf) > 0.02){
            if (A.rf > B.rf) A.rf = Math.min(1.45, A.rf + need / ORBITX);
            else B.rf = Math.min(1.45, B.rf + need / ORBITX);
          } else {
            A.ang += 0.012; B.ang -= 0.012;
          }
          moved = true;
        }
      }
      if (!moved) break;
    }
  }

    view.z = Math.max(0.52, Math.min(1.12, Math.min(zx, zy)));
    view.x = W / 2;
    view.y = H / 2;
  }       // 二级附属离父节点的距离

      var d = distSeg(w[0], w[1], par.bx, par.by, m.bx, m.by);
      var tol = 9 / view.z;
      if (d <= tol && d < bestD){ best = m; bestD = d; }
    }
    return best;
  }

  function hitTest(sx, sy){
    var w = toWorld(sx, sy);
    var best = null, bestD = 1e9;
    for (var i = 0; i < MODS.length; i++){
      var m = MODS[i];
      if (m.v < 0.45) continue;
      var R = baseRadius(m) * (0.55 + 0.45 * m.v) + 10;
      var d = Math.hypot(w[0] - m.bx, w[1] - m.by);
      if (d <= R && d < bestD){ best = m; bestD = d; }
    }
    return best;
  }

  cv.addEventListener('pointerdown', function(e){
    dragging = true; moved = 0; last = { x: e.clientX, y: e.clientY };
    vel.x = 0; vel.y = 0;
    cv.classList.add('drag');
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });

  cv.addEventListener('pointermove', function(e){
    if (!dragging){
      hover = hitTest(e.clientX, e.clientY) || hitLine(e.clientX, e.clientY);
      cv.classList.toggle('point', !!hover);
      return;
    }
    var dx = e.clientX - last.x, dy = e.clientY - last.y;
    moved += Math.abs(dx) + Math.abs(dy);
    view.x += dx; view.y += dy;
    vel.x = vel.x * 0.6 + dx * 0.4;
    vel.y = vel.y * 0.6 + dy * 0.4;
    last = { x: e.clientX, y: e.clientY };
  });

  cv.addEventListener('pointerup', function(e){
    dragging = false; cv.classList.remove('drag');
    if (moved < 6){
      vel.x = 0; vel.y = 0;
      var m = hitTest(e.clientX, e.clientY) || hitLine(e.clientX, e.clientY);
      if (!m){
        // 点空白处：收回已展开的二级节点
        var closed = false;
        for (var ci = 0; ci < MODS.length; ci++){
          var cn = MODS[ci];
          if (cn.level > 0 && cn.kids && cn.kids.length && cn.open){ cn.open = false; closed = true; }
        }
        if (closed) return;
        return;
      }
      if (m.kids.length && !m.open && m.level > 0){
        m.open = true;                 // 第一次点：把子节点放出来
        return;
      }
      if (m.level === 0) enterCreate();
      else leave(m.href);
    } else {
      var sp = Math.hypot(vel.x, vel.y);
      if (sp > VMAX){ vel.x *= VMAX / sp; vel.y *= VMAX / sp; }
      if (sp < 0.6){ vel.x = 0; vel.y = 0; }
    }
  });

  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      for (var ki = 0; ki < MODS.length; ki++){
        var kn = MODS[ki];
        if (kn.level > 0 && kn.kids && kn.kids.length) kn.open = false;
      }
    }
  });

  cv.addEventListener('pointercancel', function(){ dragging = false; cv.classList.remove('drag'); vel.x = 0; vel.y = 0; });

  cv.addEventListener('wheel', function(e){
    e.preventDefault();
    var z0 = view.z;
    var nz = Math.min(3, Math.max(0.35, z0 * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    view.x = e.clientX - (e.clientX - view.x) * (nz / z0);
    view.y = e.clientY - (e.clientY - view.y) * (nz / z0);
    view.z = nz;
  }, { passive: false });

  if (!LINKS.length){ var ld=document.getElementById('leg-dash'); if(ld) ld.style.display='none'; }

  resize();
  relayout();
  fitView();
  window.addEventListener('resize', function(){
    resize();
    relayout();
    fitView();
    if (STATIC) draw(performance.now());
  });

  // 首帧先画一次：图片加载完再补一帧（静态模式也不空白）
  draw(0);
  MODS.forEach(function(m){
    m.img.addEventListener('load', function(){ if (STATIC) draw(performance.now()); });
  });
  if (STATIC) return;
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
