<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>鞍 · 原版物品 · Create Codex</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="../index.html"><span class="gear"></span>CREATE CODEX</a>
<a class="backbtn" href="../vanilla.html">← 原版物品</a></div></header>
<main class="wrap">
<nav class="crumb"><a href="../index.html">首页</a> / <a href="../vanilla.html">原版物品</a> / <span>鞍</span></nav>
<div class="item-hero"><img class="big" src="../assets/icons/minecraft_saddle.png" alt="">
  <div><h1>鞍</h1><div class="en">Saddle</div>
    <div class="idline"><span class="copyid">minecraft:saddle</span><span class="badge">原版物品</span></div>
  </div></div>
<p class="tagline">Minecraft 原版物品。它只出现在附属模组的配方里，没有 Create 本体配方引用它。</p>
<section class="blk"><h2>属于这些标签</h2>
<div class="prose"><p>不属于任何已收录的标签。</p></div>
</section>
<section class="blk"><h2>说明</h2>
<div class="prose"><p>这一页是为了让附属模组页面里的配方格能点进来而建的。它没有 Create 的机制或配方，只是原版的一种材料。</p></div>
</section>
<div class="pager"><span></span><a href="../vanilla.html">返回原版物品</a><span></span></div>
</main>
<footer class="foot"><div class="wrap">数据与图标来自 Creators-of-Create/Create（MIT）与 Minecraft 资源，仅用于学习与教学；Minecraft 版权归 Mojang 所有。</div></footer>
<script>
document.querySelectorAll('.copyid').forEach(function(el){
  el.addEventListener('click',function(){
    var t=el.textContent.trim();
    var done=function(){el.classList.add('ok');el.textContent='已复制';
      setTimeout(function(){el.textContent=t;el.classList.remove('ok')},1200);};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,done)}
    else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);done();}
  });
});
</script>
</body></html>
