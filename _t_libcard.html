<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="assets/style.css"><style>
.wrap{max-width:1180px}
.hero{padding:44px 0 18px;text-align:center}
.hero img.big{width:96px;height:96px;border-radius:18px;background:#0d0b09}
.hero h1{font-size:34px;margin:12px 0 4px}
.hero .sub{color:var(--brass);font-size:14px;letter-spacing:.3em}
.hero .tag{color:var(--muted);margin-top:8px}
.grid-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;align-items:start}
.card{display:block;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.card .ci{float:left;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#14110c;border-radius:8px}
.card .ci img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated}
.card .t{display:flex;flex-direction:column;gap:2px;margin-left:54px;min-height:44px;justify-content:center}
.card .t b{font-size:13px}
.card .t small{color:var(--muted);font-size:10px;word-break:break-all}
.card .rec{clear:both;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.card .rec .ch{font-size:0;padding:0;border:0;background:none}
.card .rec .ch:not(:has(img)){font-size:9.5px;line-height:1.15;padding:1px 3px;border:1px solid var(--line);border-radius:4px;background:#14110c;color:#cbb894;max-width:36px;overflow:hidden;text-align:center}
.card .rec .ch img{width:26px;height:26px}
.craft .grid{display:grid;grid-template-columns:repeat(3,40px);gap:3px}
.cell{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:#14110c;border:1px solid var(--line);border-radius:6px;font-size:9px;text-align:center;overflow:hidden}
.cell.empty{border-style:dashed;opacity:.45}
.cell img{width:30px;height:30px;object-fit:contain;image-rendering:pixelated}
.mach{margin-top:4px;color:var(--brass);font-size:10px}
.ch{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:999px;background:#14110c}
.ch img{width:16px;height:16px;object-fit:contain;image-rendering:pixelated}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.rec{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.arw{color:var(--muted)}
.sub2{margin:18px 0 8px;font-size:13px;color:var(--brass)}
.note2{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
.cnt{margin-left:8px;color:var(--muted);font-size:12px;font-weight:400}
</style></head><body style="padding:20px;max-width:430px"><div class="grid-items"><div class="card"><div class="ci"><img src="assets/icons/liberate_seaf_artillery_round_he.png" alt=""></div><div class="t"><b>超级地球武装部队炮弹：高爆弹</b><small>createliberate:seaf_artillery_round_he</small></div><div class="rec"><div class="craft"><div class="grid" style="--n:3"><div class="cell empty"></div><div class="cell"><span class="ch" title="he shell">?</span></div><div class="cell empty"></div><div class="cell"><span class="ch" title="forge:ingots/iron"><img src="assets/icons/minecraft_iron_ingot.png" alt="">#iron</span></div><div class="cell"><span class="ch" title="forge:gunpowder"><img src="assets/icons/minecraft_gunpowder.png" alt="">#forge:gunpowder</span></div><div class="cell"><span class="ch" title="forge:ingots/iron"><img src="assets/icons/minecraft_iron_ingot.png" alt="">#iron</span></div><div class="cell"><span class="ch" title="forge:ingots/iron"><img src="assets/icons/minecraft_iron_ingot.png" alt="">#iron</span></div><div class="cell"><span class="ch" title="forge:gunpowder"><img src="assets/icons/minecraft_gunpowder.png" alt="">#forge:gunpowder</span></div><div class="cell"><span class="ch" title="forge:ingots/iron"><img src="assets/icons/minecraft_iron_ingot.png" alt="">#iron</span></div><div class="cell"><span class="ch" title="forge:plates/brass"><img src="assets/icons/create_brass_sheet.png" alt="">#brass</span></div><div class="cell"><span class="ch" title="forge:plates/brass"><img src="assets/icons/create_brass_sheet.png" alt="">#brass</span></div><div class="cell"><span class="ch" title="forge:plates/brass"><img src="assets/icons/create_brass_sheet.png" alt="">#brass</span></div></div></div></body></html>
